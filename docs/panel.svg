  <rect x="318" y="377" width="70" height="21" rx="10" fill="#ffffff" stroke="#9a6700"/>
  <text x="328" y="392" font-size="9.5" fill="#9a6700">2 个改动</text>
  <rect x="396" y="377" width="62" height="21" rx="10" fill="#ffffff" stroke="#1a7f37"/>
  <text x="406" y="392" font-size="9.5" fill="#1a7f37">落后 1</text>

  <text x="64" y="418" font-size="10.5" fill="#57606a" font-family="ui-monospace, Consolas, monospace">D:\githubCode\wuhy80\dsh-github-workspaces</text>
  <text x="64" y="436" font-size="10" fill="#57606a" font-family="ui-monospace, Consolas, monospace">7d8337a · 2026-10-21 · chore: 添加 MIT 许可证</text>

  <!-- 操作行 -->
  <rect x="64" y="448" width="62" height="26" rx="7" fill="#ffffff" stroke="#d0d7de"/>
  <text x="76" y="465" font-size="10.5" fill="#24292f">拉取</text>
  <rect x="134" y="448" width="62" height="26" rx="7" fill="#ffffff" stroke="#d0d7de"/>
  <text x="146" y="465" font-size="10.5" fill="#24292f">推送</text>
  <rect x="204" y="448" width="78" height="26" rx="7" fill="#ffffff" stroke="#1f6feb"/>
  <text x="214" y="465" font-size="10.5" fill="#1f6feb">改动 2</text>
  <rect x="290" y="448" width="84" height="26" rx="7" fill="#ffffff" stroke="#d0d7de"/>
  <text x="300" y="465" font-size="10.5" fill="#24292f">打开目录</text>
  <rect x="382" y="448" width="84" height="26" rx="7" fill="#ffffff" stroke="#d0d7de"/>
  <text x="392" y="465" font-size="10.5" fill="#24292f">移除登记</text>

  <!-- 改动面板（展开） -->
  <line x1="64" y1="488" x2="896" y2="488" stroke="#d0d7de"/>
  <rect x="64" y="498" width="12" height="12" rx="2" fill="#1f6feb"/>
  <path d="M67 504 l3 3 l5 -6" stroke="#ffffff" stroke-width="1.6" fill="none"/>
  <text x="84" y="508" font-size="10" fill="#57606a">全选 · 已选 2/3</text>

  <rect x="64" y="518" width="11" height="11" rx="2" fill="#1f6feb"/>
  <path d="M66.5 523.5 l2.5 2.5 l4 -5" stroke="#ffffff" stroke-width="1.5" fill="none"/>
  <rect x="84" y="516" width="34" height="18" rx="9" fill="#ffffff" stroke="#9a6700"/>
  <text x="91" y="529" font-size="9" fill="#9a6700">修改</text>
  <text x="128" y="529" font-size="10.5" fill="#24292f">README.md</text>

  <rect x="64" y="542" width="11" height="11" rx="2" fill="#1f6feb"/>
  <path d="M66.5 547.5 l2.5 2.5 l4 -5" stroke="#ffffff" stroke-width="1.5" fill="none"/>
  <rect x="84" y="540" width="44" height="18" rx="9" fill="#ffffff" stroke="#9a6700"/>
  <text x="91" y="553" font-size="9" fill="#9a6700">未跟踪</text>
  <text x="138" y="553" font-size="10.5" fill="#24292f">docs/architecture.svg</text>

  <rect x="64" y="566" width="11" height="11" rx="2" fill="#ffffff" stroke="#8c959f"/>
  <rect x="84" y="564" width="34" height="18" rx="9" fill="#ffffff" stroke="#8c959f"/>
  <text x="91" y="577" font-size="9" fill="#57606a">删除</text>
  <text x="128" y="577" font-size="10.5" fill="#8c959f">scratch.tmp</text>

  <!-- diff 预览 -->
  <rect x="64" y="594" width="832" height="86" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="76" y="612" font-size="9.5" fill="#57606a" font-family="ui-monospace, Consolas, monospace">@@ -10,2 +10,4 @@</text>
  <text x="76" y="630" font-size="9.5" fill="#8c959f" font-family="ui-monospace, Consolas, monospace">  日常就三件事</text>
  <text x="76" y="648" font-size="9.5" fill="#cf222e" font-family="ui-monospace, Consolas, monospace">- 旧的说明</text>
  <text x="76" y="666" font-size="9.5" fill="#1a7f37" font-family="ui-monospace, Consolas, monospace">+ 新的说明（勾选后只提交这些文件）</text>

  <!-- 提交行 -->
  <rect x="64" y="690" width="596" height="26" rx="7" fill="#ffffff" stroke="#d0d7de"/>
  <text x="76" y="707" font-size="10.5" fill="#8c959f">提交信息（留空用时间戳）</text>
  <rect x="668" y="690" width="228" height="26" rx="7" fill="#1f6feb"/>
  <text x="782" y="707" font-size="10.5" fill="#ffffff" text-anchor="middle">提交并推送 2 个</text>

  <text x="48" y="762" font-size="10.5" fill="#57606a">∗ 线框示意：实际配色跟随 DSH 主题（明 / 暗），分支面板、分叉与冲突块按状态出现。</text>
