<svg xmlns="http://www.w3.org/2000/svg" width="960" height="788" viewBox="0 0 960 788" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">
  <rect width="960" height="788" fill="#eef1f4"/>

  <!-- 面板页面 -->
  <rect x="24" y="40" width="912" height="700" rx="12" fill="#ffffff" stroke="#d0d7de"/>

  <!-- 页头 -->
  <text x="48" y="78" font-size="15" font-weight="700" fill="#1f2328">GitHub 工作区</text>
  <text x="48" y="98" font-size="11.5" fill="#57606a">每个 GitHub 仓库就是一个工作区，标题取仓库名</text>
  <rect x="742" y="66" width="84" height="26" rx="7" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="754" y="83" font-size="11" fill="#24292f">网络自检</text>
  <rect x="836" y="66" width="72" height="26" rx="7" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="856" y="83" font-size="11" fill="#24292f">刷新</text>
  <line x1="24" y1="112" x2="936" y2="112" stroke="#d0d7de"/>

  <!-- 环境条 -->
  <rect x="48" y="126" width="112" height="22" rx="11" fill="#ffffff" stroke="#d0d7de"/>
  <text x="58" y="141" font-size="10.5" fill="#1a7f37">git 2.44.0</text>
  <rect x="168" y="126" width="146" height="22" rx="11" fill="#ffffff" stroke="#d0d7de"/>
  <text x="178" y="141" font-size="10.5" fill="#1a7f37">token 来自环境变量</text>
  <text x="326" y="141" font-size="10.5" fill="#57606a" font-family="ui-monospace, Consolas, monospace">D:\githubCode</text>

  <!-- 打开仓库 -->
  <rect x="48" y="164" width="864" height="152" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="64" y="186" font-size="10.5" font-weight="700" fill="#57606a">打开仓库</text>
  <rect x="64" y="196" width="700" height="30" rx="7" fill="#ffffff" stroke="#d0d7de"/>
  <text x="76" y="216" font-size="11" fill="#8c959f">owner/repo，或 https://github.com/owner/repo，或 git@github.com:owner/repo.git</text>
  <rect x="772" y="196" width="124" height="30" rx="7" fill="#1f6feb"/>
  <text x="822" y="216" font-size="11" fill="#ffffff" text-anchor="middle">打开</text>

  <rect x="64" y="236" width="124" height="26" rx="7" fill="#ffffff" stroke="#d0d7de"/>
  <text x="74" y="253" font-size="10.5" fill="#24292f">加载我的仓库</text>

  <rect x="200" y="236" width="696" height="24" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="210" y="252" font-size="10.5" fill="#24292f">wuhy80/obsidian-vault</text>
  <text x="380" y="252" font-size="9.5" fill="#57606a">public</text>
  <text x="820" y="252" font-size="10" fill="#1f6feb">打开</text>

  <rect x="200" y="268" width="696" height="24" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="210" y="284" font-size="10.5" fill="#24292f">wuhy80/llm-news-tracker</text>
  <text x="380" y="284" font-size="9.5" fill="#9a6700">971 MB</text>
  <text x="820" y="284" font-size="10" fill="#1f6feb">打开</text>

  <!-- 工作区小节 -->
  <text x="48" y="344" font-size="10.5" font-weight="700" fill="#57606a">已打开的工作区 · 2</text>
  <rect x="690" y="330" width="90" height="24" rx="7" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="702" y="346" font-size="10.5" fill="#24292f">检查更新</text>
  <rect x="788" y="330" width="90" height="24" rx="7" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="800" y="346" font-size="10.5" fill="#24292f">全部拉取</text>

  <!-- 工作区卡片 -->
  <rect x="48" y="364" width="864" height="356" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="64" y="392" font-size="13" font-weight="700" fill="#1f2328">dsh-github-workspaces</text>
  <rect x="238" y="377" width="72" height="21" rx="10" fill="#ffffff" stroke="#1f6feb"/>
